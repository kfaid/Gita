<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhagavad Gita AI</title>
    <!-- Google Fonts for premium spiritual and modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Custom Variables for a Premium Saffron & Gold Theme */
        :root {
            --primary-grad: linear-gradient(135deg, #ff6b08 0%, #ff8e53 50%, #f9d423 100%);
            --bg-dark: #0f0714;
            --bg-radial: radial-gradient(circle at center, #1b0e22 0%, #08030c 100%);
            --card-bg: rgba(26, 17, 34, 0.65);
            --card-hover: rgba(38, 25, 50, 0.85);
            --border-glow: rgba(255, 107, 8, 0.2);
            --border-hover: rgba(249, 212, 35, 0.5);
            --gold: #f9d423;
            --saffron: #ff6b08;
            --cream: #f4eae1;
            --text-muted: #b2a4b8;
            --white: #ffffff;
            --error-red: #ff4a4a;
        }

        /* Base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-radial);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Decorative stars background animation */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.15;
            animation: backgroundMove 120s linear infinite;
        }

        @keyframes backgroundMove {
            from { background-position: 0 0, 40px 60px, 130px 270px; }
            to { background-position: 550px 550px, 390px 410px, 380px 820px; }
        }

        /* App Container */
        .app-container {
            width: 100%;
            max-width: 1100px;
            padding: 2.5rem 1.5rem;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        /* Header Style */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 1s ease-out;
        }

        .header-logo {
            width: 70px;
            height: 70px;
            margin-bottom: 1rem;
            fill: url(#saffronGoldGrad);
            filter: drop-shadow(0 0 15px rgba(255, 107, 8, 0.4));
            animation: pulseGlow 4s infinite ease-in-out;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Search Section */
        .search-section {
            width: 100%;
            max-width: 720px;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
        }

        .search-card:focus-within {
            border-color: var(--border-hover);
            box-shadow: 0 15px 40px rgba(255, 107, 8, 0.15), 0 0 0 1px var(--border-hover), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .search-box-container {
            display: flex;
            gap: 0.75rem;
            position: relative;
        }

        .search-input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .search-icon-svg {
            position: absolute;
            left: 1.25rem;
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            pointer-events: none;
            transition: fill 0.3s;
        }

        .search-input {
            width: 100%;
            background: rgba(10, 5, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.1rem 1.1rem 1.1rem 3.25rem;
            font-size: 1.05rem;
            color: var(--white);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: rgba(10, 5, 15, 0.85);
            border-color: rgba(255, 142, 83, 0.5);
        }

        .search-input:focus + .search-icon-svg {
            fill: var(--gold);
        }

        .ask-btn {
            background: var(--primary-grad);
            border: none;
            border-radius: 12px;
            padding: 0 2rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #12061c;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(255, 107, 8, 0.3);
        }

        .ask-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 8, 0.5);
            filter: brightness(1.1);
        }

        .ask-btn:active {
            transform: translateY(1px);
        }

        /* Chips / Sample Questions */
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1.25rem;
            justify-content: center;
        }

        .chip-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            align-self: center;
            margin-right: 0.5rem;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            color: var(--cream);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .chip:hover {
            background: rgba(255, 107, 8, 0.15);
            border-color: rgba(255, 107, 8, 0.4);
            transform: translateY(-1px);
        }

        /* Results / Card Container */
        .results-section {
            width: 100%;
            display: none; /* Controlled by JS */
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeInUp 0.8s ease-out;
            margin-bottom: 2rem;
        }

        .results-header {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .results-header::before, .results-header::after {
            content: '';
            display: block;
            width: 60px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold));
        }

        .results-header::after {
            background: linear-gradient(to left, transparent, var(--gold));
        }

        .verse-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 18px;
            padding: 1.75rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .verse-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            width: 100%;
            background: var(--primary-grad);
            opacity: 0.8;
        }

        .verse-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            box-shadow: 0 15px 30px rgba(255, 142, 83, 0.12), 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 0.75rem;
        }

        .verse-ref {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .verse-ref svg {
            width: 18px;
            height: 18px;
            fill: var(--gold);
        }

        .score-badge {
            background: rgba(255, 142, 83, 0.1);
            border: 1px solid rgba(255, 142, 83, 0.3);
            color: #ff8e53;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .score-badge .score-dot {
            width: 6px;
            height: 6px;
            background-color: #ff8e53;
            border-radius: 50%;
            display: inline-block;
        }

        .verse-meaning {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--cream);
            font-style: italic;
            position: relative;
            padding-left: 1rem;
            border-left: 2px solid var(--saffron);
        }

        .score-bar-wrapper {
            margin-top: 0.25rem;
        }

        .score-bar-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .score-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .score-bar-fill {
            background: var(--primary-grad);
            height: 100%;
            border-radius: 10px;
            width: 0%; /* Populated by JS */
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Loading Spinner */
        .loader-container {
            display: none; /* Controlled by JS */
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            margin: 3rem 0;
            animation: fadeIn 0.4s ease;
        }

        .dharmachakra {
            width: 70px;
            height: 70px;
            fill: var(--gold);
            filter: drop-shadow(0 0 10px rgba(249, 212, 35, 0.4));
            animation: spin 6s linear infinite;
        }

        .loader-text {
            color: var(--cream);
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-align: center;
            opacity: 0.95;
            animation: pulseText 1.8s infinite ease-in-out;
        }

        /* Error Banner */
        .error-banner {
            display: none;
            background: rgba(255, 74, 74, 0.1);
            border: 1px solid rgba(255, 74, 74, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: var(--error-red);
            font-size: 0.95rem;
            width: 100%;
            max-width: 720px;
            margin-bottom: 2rem;
            text-align: center;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            animation: shake 0.4s ease-in-out;
        }

        /* Footer */
        footer {
            width: 100%;
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1;
            margin-top: auto;
        }

        footer a {
            color: var(--gold);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* SVG Gradients definitions */
        .svg-defs {
            position: absolute;
            width: 0;
            height: 0;
        }

        /* Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 107, 8, 0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 25px rgba(255, 168, 0, 0.7)); transform: scale(1.05); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .search-card {
                padding: 1.5rem;
            }

            .search-box-container {
                flex-direction: column;
                gap: 1rem;
            }

            .search-input {
                padding: 1rem 1rem 1rem 3rem;
            }

            .ask-btn {
                padding: 1rem;
                width: 100%;
            }

            .verse-card {
                padding: 1.25rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- SVG Defs for linear gradients used across multiple SVG elements -->
    <svg class="svg-defs">
        <defs>
            <linearGradient id="saffronGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff6b08" />
                <stop offset="50%" stop-color="#ff8e53" />
                <stop offset="100%" stop-color="#f9d423" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Starry background decoration -->
    <div class="stars"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <!-- Glowing Lotus Mandala SVG -->
            <svg class="header-logo" viewBox="0 0 64 64">
                <path d="M32 2C24 16 12 20 12 28C12 38 20 44 32 60C44 44 52 38 52 28C52 20 40 16 32 2Z" fill="url(#saffronGoldGrad)"/>
                <circle cx="32" cy="28" r="8" fill="#0f0714"/>
                <path d="M32 23C29.2 23 27 25.2 27 28C27 30.8 29.2 33 32 33C34.8 33 37 30.8 37 28C37 25.2 34.8 23 32 23Z" fill="url(#saffronGoldGrad)"/>
                <path d="M32 10C32 10 38 18 38 24C38 27.3 35.3 30 32 30C28.7 30 26 27.3 26 24C26 18 32 10 32 10Z" fill="#ffb85c" opacity="0.6"/>
            </svg>
            <h1>Bhagavad Gita AI</h1>
            <p class="subtitle">Ask spiritual questions from the wisdom of the Gita</p>
        </header>

        <!-- Search Bar Section -->
        <section class="search-section">
            <div class="search-card">
                <form id="search-form" onsubmit="handleQuerySubmit(event)">
                    <div class="search-box-container">
                        <div class="search-input-wrapper">
                            <input 
                                type="text" 
                                id="query-input" 
                                class="search-input" 
                                placeholder="Ask Bhagavad Gita anything..." 
                                autocomplete="off"
                                required
                            />
                            <!-- Search Glass SVG -->
                            <svg class="search-icon-svg" viewBox="0 0 24 24">
                                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                            </svg>
                        </div>
                        <button type="submit" class="ask-btn" id="submit-btn">
                            <span>Ask Gita</span>
                            <!-- Sparkles/Magic SVG -->
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Example Chips -->
                <div class="chips-container">
                    <span class="chip-label">Try asking:</span>
                    <button class="chip" onclick="fillAndSubmit('Who is Krishna?')">Who is Krishna?</button>
                    <button class="chip" onclick="fillAndSubmit('What is Maya?')">What is Maya?</button>
                    <button class="chip" onclick="fillAndSubmit('What is Karma?')">What is Karma?</button>
                    <button class="chip" onclick="fillAndSubmit('How to find peace?')">How to find peace?</button>
                </div>
            </div>
        </section>

        <!-- Error Banner -->
        <div id="error-banner" class="error-banner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="error-message">An error occurred while fetching the answer.</span>
        </div>

        <!-- Loading spinner -->
        <div id="loader" class="loader-container">
            <!-- Dharmachakra (Wheel of Dharma) SVG -->
            <svg class="dharmachakra" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <line x1="12" y1="3" x2="12" y2="21" stroke="currentColor" stroke-width="1.5"/>
                <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.5"/>
                <line x1="5.64" y1="5.64" x2="18.36" y2="18.36" stroke="currentColor" stroke-width="1.5"/>
                <line x1="5.64" y1="18.36" x2="18.36" y2="5.64" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <div class="loader-text">Seeking wisdom from the eternal verses...</div>
        </div>

        <!-- Answers / Results Grid -->
        <section id="results" class="results-section">
            <h2 class="results-header">Gita Wisdom</h2>
            <div id="cards-wrapper" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <!-- Cards will be dynamically injected here -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Bhagavad Gita AI. Designed for spiritual reflection and learning.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        function fillAndSubmit(text) {
            const input = document.getElementById('query-input');
            input.value = text;
            // Scroll to search container if scrolled down
            input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // Submit search form
            document.getElementById('search-form').dispatchEvent(new Event('submit'));
        }

        async function handleQuerySubmit(event) {
            event.preventDefault();

            const queryInput = document.getElementById('query-input');
            const submitBtn = document.getElementById('submit-btn');
            const loader = document.getElementById('loader');
            const resultsSection = document.getElementById('results');
            const cardsWrapper = document.getElementById('cards-wrapper');
            const errorBanner = document.getElementById('error-banner');
            const errorMessage = document.getElementById('error-message');

            const question = queryInput.value.trim();
            if (!question) return;

            // UI State: Reset and show loader
            errorBanner.style.display = 'none';
            resultsSection.style.display = 'none';
            cardsWrapper.innerHTML = '';
            
            loader.style.display = 'flex';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            try {
                // Construct GET URL with URLSearchParams
                const url = new URL('/ask', window.location.origin);
                url.searchParams.append('question', question);

                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP error! Status: ${response.status}`);
                }

                if (!data.answers || data.answers.length === 0) {
                    throw new Error("No teachings matched your query. Try rephrasing.");
                }

                // Render matching verses
                renderCards(data.answers);

                // UI State: Hide loader and display results
                loader.style.display = 'none';
                resultsSection.style.display = 'flex';
                
                // Trigger transition delay for cards
                const cards = document.querySelectorAll('.verse-card');
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                        
                        // Fill similarity bars
                        const fillBar = card.querySelector('.score-bar-fill');
                        if (fillBar) {
                            const scorePct = fillBar.getAttribute('data-score');
                            fillBar.style.width = `${scorePct}%`;
                        }
                    }, index * 150);
                });

            } catch (err) {
                // UI State: Hide loader, show error banner
                loader.style.display = 'none';
                errorMessage.textContent = err.message || "Something went wrong. Please try again.";
                errorBanner.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        }

        function renderCards(answers) {
            const cardsWrapper = document.getElementById('cards-wrapper');
            cardsWrapper.innerHTML = '';

            answers.forEach((ans) => {
                // Convert similarity score to a clean percentage string
                const scorePercentage = Math.round(ans.Score * 100);
                // Clamp value between 0 and 100
                const displayPercentage = Math.max(0, Math.min(100, scorePercentage));

                const cardHtml = `
                    <div class="verse-card" style="opacity: 0; transform: translateY(15px); transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);">
                        <div class="card-top">
                            <div class="verse-ref">
                                <!-- Sacred Lotus Icon -->
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22ZM12 17.5C10.6193 17.5 9.5 16.3807 9.5 15C9.5 13.6193 10.6193 12.5 12 12.5C13.6193 12.5 14.5 13.6193 14.5 15C14.5 16.3807 13.6193 17.5 12 17.5ZM12 11.5C10.3431 11.5 9 10.1569 9 8.5C9 6.84315 10.3431 5.5 12 5.5C13.6569 5.5 15 6.84315 15 8.5C15 10.1569 13.6569 11.5 12 11.5Z"/>
                                </svg>
                                Chapter ${ans.Chapter}, Verse ${ans.Verse}
                            </div>
                            <div class="score-badge">
                                <span class="score-dot"></span>
                                Match Relevance: ${displayPercentage}%
                            </div>
                        </div>
                        
                        <blockquote class="verse-meaning">
                            "${escapeHtml(ans.Meaning)}"
                        </blockquote>

                        <div class="score-bar-wrapper">
                            <div class="score-bar-text">
                                <span>Relevance level</span>
                                <span>${displayPercentage}% Match</span>
                            </div>
                            <div class="score-bar-bg">
                                <div class="score-bar-fill" data-score="${displayPercentage}"></div>
                            </div>
                        </div>
                    </div>
                `;
                cardsWrapper.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Helper to escape HTML tags to prevent XSS
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
